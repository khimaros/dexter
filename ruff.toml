# the linter's home. there is no packaging to declare: the tool runs from a
# checkout with nothing installed.
line-length = 100
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F", "I"]

# a test adds the checkout to its path before importing the tool and its fixtures
[lint.per-file-ignores]
"tests/**" = ["E402"]
